[project]
name = "farmcare-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2,<3",
    "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23,<26",
    "PyJWT>=2.9,<3", "email-validator>=2,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
